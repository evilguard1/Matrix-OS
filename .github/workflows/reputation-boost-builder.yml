name: reputation-boost-builder

'on':
  push:
    branches:
      - feat/reputation-boost

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reputation-boost
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Recover and apply staged implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = subprocess.check_output(
              ["git", "show", "6665ad2c7dd66242708280a923b4419037b5319d:.github/workflows/reputation-boost-builder.yml"],
              text=True,
          )
          marker = "          python - <<'PY'\n"
          start = old.index(marker) + len(marker)
          end = old.index("\n          PY\n", start)
          lines = old[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          for fragment in (
              "const schedulerReserveRam = ramNow.free * reserveFraction;",
              "const schedulerReserveRam = ramNow.schedulableFree * reserveFraction;",
              "const schedulerUsableIdleRam = Math.max(0, ramNow.free - schedulerReserveRam);",
              "const schedulerUsableIdleRam = Math.max(0, ramNow.schedulableFree - schedulerReserveRam);",
              "if (schedulerUsableIdleRam < snapshot.shape.ram) break fill;",
              "const pool = freePool(ns, hosts, cfg).map(item => ({",
              "const pool = schedulablePool(ns, hosts, cfg, boost).map(item => ({",
          ):
              script = script.replace("\n            " + fragment, "\n                " + fragment)
          Path("/tmp/apply-reputation-boost.py").write_text(script + "\n")
          PY
          python /tmp/apply-reputation-boost.py
      - run: npm ci
      - run: npm test
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/reputation-boost-builder.yml
          git add -A
          git commit -m "Implement bounded reputation boost controller"
          git push origin HEAD:feat/reputation-boost
