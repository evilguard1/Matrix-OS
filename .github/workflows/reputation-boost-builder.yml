name: reputation-boost-builder

on:
  push:
    branches:
      - feat/reputation-boost

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reputation-boost
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded reputation boost implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          Path("matrix/lib/reputation-boost.js").write_text(r'''export const BOOST_TYPE = "reputation-boost";
          export const BOOST_MODE_NORMAL = "normal";
          export const BOOST_MODE_MAX = "max";
          export const BOOST_REQUEST_STATE = "/matrix/state/boost-request.txt";
          export const SHARE_SCRIPT = "/matrix/workers/share.js";
          export const BOOST_ARG = "--boost";
          export const BOOST_END_ARG = "--ends";
          export const BOOST_SLOT_ARG = "--slot";

          function objectValue(value) {
              return value && typeof value === "object" ? value : {};
          }

          function finite(value, fallback = 0) {
              const n = Number(value);
              return Number.isFinite(n) ? n : fallback;
          }

          function normalizeMode(mode) {
              const value = String(mode ?? "").trim().toLowerCase();
              if (value === BOOST_MODE_NORMAL || value === "rep") return BOOST_MODE_NORMAL;
              if (value === BOOST_MODE_MAX || value === "max-rep" || value === "maxrep") return BOOST_MODE_MAX;
              return null;
          }

          export function parseDuration(value) {
              const raw = (Array.isArray(value) ? value.join(" ") : String(value ?? ""))
                  .trim()
                  .toLowerCase();
              if (!raw) return null;

              const units = {
                  ms: 1, millisecond: 1, milliseconds: 1,
                  s: 1_000, sec: 1_000, secs: 1_000, second: 1_000, seconds: 1_000,
                  m: 60_000, min: 60_000, mins: 60_000, minute: 60_000, minutes: 60_000,
                  h: 3_600_000, hr: 3_600_000, hrs: 3_600_000, hour: 3_600_000, hours: 3_600_000,
                  d: 86_400_000, day: 86_400_000, days: 86_400_000,
              };
              const re = /(\d+(?:\.\d+)?)\s*(milliseconds?|ms|seconds?|secs?|sec|s|minutes?|mins?|min|m|hours?|hrs?|hr|h|days?|d)/g;
              let total = 0;
              let matched = false;
              let end = 0;
              let match;
              while ((match = re.exec(raw)) !== null) {
                  if (raw.slice(end, match.index).trim()) return null;
                  const amount = Number(match[1]);
                  const multiplier = units[match[2]];
                  if (!Number.isFinite(amount) || amount <= 0 || !multiplier) return null;
                  total += amount * multiplier;
                  matched = true;
                  end = re.lastIndex;
              }
              if (!matched || raw.slice(end).trim() || !Number.isFinite(total) || total <= 0) return null;
              return Math.max(1, Math.round(total));
          }

          export function makeBoostRequest(mode, durationMs, now = Date.now(), boostId = "") {
              const normalizedMode = normalizeMode(mode);
              const duration = finite(durationMs, 0);
              const startedAt = finite(now, Date.now());
              if (!normalizedMode || duration <= 0) return null;
              const id = String(boostId ?? "").trim() || `boost-${Math.floor(startedAt).toString(36)}`;
              return {
                  type: BOOST_TYPE,
                  status: "requested",
                  mode: normalizedMode,
                  boostId: id,
                  startedAt,
                  durationMs: duration,
                  endsAt: startedAt + duration,
              };
          }

          export function makeCancelRequest(previous, now = Date.now()) {
              const prior = objectValue(previous);
              return {
                  type: BOOST_TYPE,
                  status: "cancelled",
                  boostId: String(prior.boostId ?? "") || null,
                  cancelledAt: finite(now, Date.now()),
              };
          }

          export function normalizeBoostRequest(raw, now = Date.now()) {
              const source = objectValue(raw);
              if (source.type !== BOOST_TYPE) return null;
              if (["cancelled", "canceled"].includes(String(source.status ?? "").toLowerCase())) return null;
              const mode = normalizeMode(source.mode);
              const boostId = String(source.boostId ?? "").trim();
              const startedAt = finite(source.startedAt, NaN);
              const endsAt = finite(source.endsAt, NaN);
              const observedAt = finite(now, Date.now());
              if (!mode || !boostId || !Number.isFinite(startedAt) || !Number.isFinite(endsAt)) return null;
              if (endsAt <= observedAt) return null;
              const durationMs = finite(source.durationMs, endsAt - startedAt);
              return {
                  type: BOOST_TYPE,
                  status: "active",
                  mode,
                  boostId,
                  startedAt,
                  durationMs: Math.max(0, durationMs),
                  endsAt,
                  remainingMs: Math.max(0, endsAt - observedAt),
              };
          }

          export function shareArgs(boost, slot = 0) {
              const source = objectValue(boost);
              return [
                  BOOST_ARG,
                  String(source.boostId ?? ""),
                  BOOST_END_ARG,
                  String(finite(source.endsAt, 0)),
                  BOOST_SLOT_ARG,
                  String(Math.max(0, Math.floor(finite(slot, 0)))),
              ];
          }

          export function shareProcessMeta(proc) {
              const source = objectValue(proc);
              if (String(source.filename ?? "") !== SHARE_SCRIPT) return null;
              const args = Array.isArray(source.args) ? source.args.map(value => String(value)) : [];
              const valueAfter = key => {
                  const index = args.indexOf(key);
                  return index >= 0 && index + 1 < args.length ? args[index + 1] : null;
              };
              const boostId = String(valueAfter(BOOST_ARG) ?? "").trim();
              if (!boostId) return null;
              const endsAt = finite(valueAfter(BOOST_END_ARG), 0);
              const slot = Math.max(0, Math.floor(finite(valueAfter(BOOST_SLOT_ARG), 0)));
              return { boostId, endsAt, slot };
          }

          export function isOwnedShareProcess(proc, boostId) {
              const id = String(boostId ?? "").trim();
              if (!id) return false;
              const meta = shareProcessMeta(proc);
              return Boolean(meta && meta.boostId === id);
          }

          export function shareCapacityThreads(input) {
              const source = objectValue(input);
              const maxRam = Math.max(0, finite(source.maxRam, 0));
              const usedRam = Math.max(0, finite(source.usedRam, 0));
              const reserveRam = Math.max(0, finite(source.reserveRam, 0));
              const ownedRam = Math.max(0, finite(source.ownedRam, 0));
              const scriptRam = Math.max(0, finite(source.scriptRam, 0));
              if (scriptRam <= 0) return 0;
              return Math.max(0, Math.floor(Math.max(0, maxRam - usedRam - reserveRam + ownedRam) / scriptRam));
          }

          export function normalShareBudget(schedulableFreeRam, reserveFraction = 0) {
              const free = Math.max(0, finite(schedulableFreeRam, 0));
              const reserve = Math.min(0.9, Math.max(0, finite(reserveFraction, 0)));
              return Math.max(0, free * (1 - reserve));
          }

          export function planShareThreads(hosts, budgetRam, scriptRam) {
              const list = Array.isArray(hosts) ? hosts : [];
              const ram = Math.max(0, finite(scriptRam, 0));
              if (ram <= 0) return [];
              let remaining = Math.max(0, finite(budgetRam, 0));
              const out = [];
              for (const raw of list) {
                  if (remaining < ram) break;
                  const host = objectValue(raw);
                  const availableRam = Math.max(0, finite(host.availableRam, 0));
                  const threads = Math.max(0, Math.floor(Math.min(availableRam, remaining) / ram));
                  if (threads <= 0) continue;
                  const allocatedRam = threads * ram;
                  out.push({ host: String(host.host ?? ""), threads, ram: allocatedRam });
                  remaining = Math.max(0, remaining - allocatedRam);
              }
              return out;
          }

          export function maxBoostReady(state) {
              const source = objectValue(state);
              return Math.max(0, finite(source.activeBatches, 0)) === 0 &&
                  Math.max(0, finite(source.activePrep, 0)) === 0 &&
                  Math.max(0, finite(source.legacyWorkers, 0)) === 0;
          }
          ''')

          Path("matrix/boost.js").write_text(r'''import { readJson, writeJson, writeState } from "/matrix/lib/common.js";
          import {
              BOOST_MODE_MAX,
              BOOST_MODE_NORMAL,
              BOOST_REQUEST_STATE,
              makeBoostRequest,
              makeCancelRequest,
              parseDuration,
          } from "/matrix/lib/reputation-boost.js";

          function usage(ns) {
              ns.tprint("MATRIX reputation boost usage:");
              ns.tprint("  run /matrix/boost.js rep 10m");
              ns.tprint("  run /matrix/boost.js max 20m");
              ns.tprint("  run /matrix/boost.js cancel");
          }

          export async function main(ns) {
              const command = String(ns.args?.[0] ?? "").trim().toLowerCase();
              const now = Date.now();

              if (command === "cancel" || command === "stop") {
                  const previous = readJson(ns, BOOST_REQUEST_STATE, null);
                  const cancelled = makeCancelRequest(previous, now);
                  await writeJson(ns, BOOST_REQUEST_STATE, cancelled);
                  await writeState(ns, "boost", {
                      status: "cancel-requested",
                      mode: previous?.mode ?? null,
                      boostId: previous?.boostId ?? null,
                      cancelledAt: now,
                      phase: "restore-pending",
                      admissionPaused: false,
                      restoreState: "pending",
                      error: null,
                  });
                  ns.tprint("[MATRIX] Reputation boost cancellation requested.");
                  return;
              }

              const mode = command === "rep" || command === "normal"
                  ? BOOST_MODE_NORMAL
                  : command === "max" || command === "maxrep" || command === "max-rep"
                      ? BOOST_MODE_MAX
                      : null;
              const durationMs = parseDuration((ns.args ?? []).slice(1));
              if (!mode || !durationMs) {
                  usage(ns);
                  return;
              }

              const boostId = `boost-${now.toString(36)}-${Math.floor(Math.random() * 0x100000).toString(36)}`;
              const request = makeBoostRequest(mode, durationMs, now, boostId);
              if (!request) {
                  usage(ns);
                  return;
              }

              await writeJson(ns, BOOST_REQUEST_STATE, request);
              await writeState(ns, "boost", {
                  status: "requested",
                  mode,
                  boostId,
                  durationMs,
                  startedAt: request.startedAt,
                  endsAt: request.endsAt,
                  remainingMs: durationMs,
                  phase: mode === BOOST_MODE_MAX ? "drain-pending" : "share-pending",
                  admissionPaused: mode === BOOST_MODE_MAX,
                  restoreState: "pending",
                  error: null,
              });
              ns.tprint(`[MATRIX] ${mode === BOOST_MODE_MAX ? "BOOST MAX REP" : "BOOST REP"} active for ${Math.ceil(durationMs / 1000)}s (${boostId}).`);
          }
          ''')

          Path("tests/reputation-boost.mjs").write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import {
              BOOST_MODE_MAX,
              BOOST_MODE_NORMAL,
              BOOST_TYPE,
              SHARE_SCRIPT,
              isOwnedShareProcess,
              makeBoostRequest,
              makeCancelRequest,
              maxBoostReady,
              normalShareBudget,
              normalizeBoostRequest,
              parseDuration,
              planShareThreads,
              shareArgs,
              shareCapacityThreads,
              shareProcessMeta,
          } from "../matrix/lib/reputation-boost.js";

          assert.equal(parseDuration("10m"), 600_000);
          assert.equal(parseDuration("20 minutes"), 1_200_000);
          assert.equal(parseDuration("1h 30m"), 5_400_000);
          assert.equal(parseDuration("20"), null);

          const normal = makeBoostRequest("rep", 600_000, 1_000, "boost-a");
          assert.equal(normal.type, BOOST_TYPE);
          assert.equal(normal.mode, BOOST_MODE_NORMAL);
          assert.equal(normal.endsAt, 601_000);

          const maximum = makeBoostRequest("max", 1_200_000, 2_000, "boost-b");
          assert.equal(maximum.mode, BOOST_MODE_MAX);
          assert.equal(maximum.endsAt, 1_202_000);

          const active = normalizeBoostRequest(normal, 101_000);
          assert.equal(active.boostId, "boost-a");
          assert.equal(active.remainingMs, 500_000);
          assert.equal(normalizeBoostRequest(normal, normal.endsAt), null, "expiry must fail safe to normal mode");
          assert.equal(normalizeBoostRequest(makeCancelRequest(normal, 5_000), 5_001), null);

          const args = shareArgs(normal, 3);
          const owned = { filename: SHARE_SCRIPT, threads: 7, args };
          assert.equal(shareProcessMeta(owned).boostId, "boost-a");
          assert.equal(shareProcessMeta(owned).slot, 3);
          assert.equal(isOwnedShareProcess(owned, "boost-a"), true);
          assert.equal(isOwnedShareProcess(owned, "boost-b"), false);
          assert.equal(isOwnedShareProcess({ filename: SHARE_SCRIPT, args: [] }, "boost-a"), false);

          assert.equal(shareCapacityThreads({ maxRam: 64, usedRam: 20, reserveRam: 8, ownedRam: 0, scriptRam: 4 }), 9);
          assert.equal(shareCapacityThreads({ maxRam: 64, usedRam: 52, reserveRam: 8, ownedRam: 16, scriptRam: 4 }), 5,
              "owned share RAM must remain reclaimable scheduler capacity");
          assert.equal(normalShareBudget(100, 0.05), 95);

          assert.deepEqual(planShareThreads([
              { host: "a", availableRam: 20 },
              { host: "b", availableRam: 20 },
          ], 24, 4), [
              { host: "a", threads: 5, ram: 20 },
              { host: "b", threads: 1, ram: 4 },
          ]);

          assert.equal(maxBoostReady({ activeBatches: 0, activePrep: 0, legacyWorkers: 0 }), true);
          assert.equal(maxBoostReady({ activeBatches: 1, activePrep: 0, legacyWorkers: 0 }), false);
          assert.equal(maxBoostReady({ activeBatches: 0, activePrep: 1, legacyWorkers: 0 }), false);
          assert.equal(maxBoostReady({ activeBatches: 0, activePrep: 0, legacyWorkers: 1 }), false);

          const hacking = fs.readFileSync("matrix/services/hacking.js", "utf8");
          const coordinator = fs.readFileSync("matrix/services/coordinator.js", "utf8");
          const worker = fs.readFileSync("matrix/workers/share.js", "utf8");
          assert.doesNotMatch(hacking, /SHARE_FRACTION/);
          assert.doesNotMatch(hacking, /scriptKill\s*\(\s*SHARE/);
          assert.doesNotMatch(hacking, /killall/i);
          assert.match(hacking, /reclaimBoostShareForRam/);
          assert.match(hacking, /maxBoostReady/);
          assert.match(hacking, /admissionPaused/);
          assert.match(coordinator, /directives\.reputationBoost/);
          assert.match(worker, /--ends/);
          assert.match(worker, /Date\.now\(\)\s*<\s*endsAt/);

          console.log("MATRIX-OS reputation boost passed: bounded duration, ownership, reclaimability, drain gating, cleanup guards.");
          ''')

          Path("matrix/workers/share.js").write_text(r'''/** Boosts faction reputation gain while working. 1.6 base + 2.4 share = 4.0 GB. */
          export async function main(ns) {
              const args = (ns.args ?? []).map(value => String(value));
              const endIndex = args.indexOf("--ends");
              const bounded = args.includes("--boost") && endIndex >= 0;
              const endsAt = bounded ? Number(args[endIndex + 1]) : Infinity;

              if (bounded && Number.isFinite(endsAt)) {
                  while (Date.now() < endsAt) await ns.share();
                  return;
              }

              while (true) await ns.share();
          }
          ''')

          replace_once("manifest.json",
          '    { "path": "matrix/lib/hacking-planner.js", "stage": "full" },\n',
          '    { "path": "matrix/lib/hacking-planner.js", "stage": "full" },\n    { "path": "matrix/lib/reputation-boost.js", "stage": "full" },\n    { "path": "matrix/boost.js", "stage": "full" },\n')

          replace_once("package.json",
          '"test": "node tests/validate.mjs && node tests/planner.mjs && node tests/factions.mjs',
          '"test": "node tests/validate.mjs && node tests/planner.mjs && node tests/reputation-boost.mjs && node tests/factions.mjs')

          replace_once("matrix/services/coordinator.js",
          'import { FULL_ENGINE_HOME_RAM } from "/matrix/lib/stages.js";\n',
          'import { FULL_ENGINE_HOME_RAM } from "/matrix/lib/stages.js";\nimport { BOOST_REQUEST_STATE, normalizeBoostRequest } from "/matrix/lib/reputation-boost.js";\n')

          replace_once("matrix/services/coordinator.js",
          '''            const result = evaluateObjective(data);
                      const plan = planDirectives({ ...data, objective: result });

                      await writeJson(ns, COORDINATOR_STATE, {''',
          '''            const result = evaluateObjective(data);
                      const plan = planDirectives({ ...data, objective: result });
                      const reputationBoost = normalizeBoostRequest(
                          readJson(ns, BOOST_REQUEST_STATE, null),
