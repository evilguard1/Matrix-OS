                      if (reputationBoost) plan.directives.reputationBoost = reputationBoost;

                      await writeJson(ns, COORDINATOR_STATE, {''')

          replace_once("matrix/services/hacking.js",
          '''import {
              PLANNER_NATIVE,
              PLANNER_FORMULAS,
              formulaBatchShape,
              formulaProbePlanningSnapshot,
              formulaTargetScore,
              selectPlanningContext,
          } from "/matrix/lib/hacking-planner.js";
''',
          '''import {
              PLANNER_NATIVE,
              PLANNER_FORMULAS,
              formulaBatchShape,
              formulaProbePlanningSnapshot,
              formulaTargetScore,
              selectPlanningContext,
          } from "/matrix/lib/hacking-planner.js";
          import {
              BOOST_MODE_MAX,
              BOOST_MODE_NORMAL,
              BOOST_TYPE,
              isOwnedShareProcess,
              maxBoostReady,
              normalShareBudget,
              normalizeBoostRequest,
              planShareThreads,
              shareArgs,
              shareCapacityThreads,
              shareProcessMeta,
          } from "/matrix/lib/reputation-boost.js";
''')

          replace_once("matrix/services/hacking.js",
          'const SHARE_FRACTION = 0.25;\n',
          'const BOOST_RECONCILE_MS = 1_000;\n')

          replace_once("matrix/services/hacking.js",
          '''function liveRam(ns, hosts, cfg) {
              const reserveHome = homeReserveFor(ns.getServerMaxRam("home"), cfg);
              let max = 0;
              let used = 0;
              let free = 0;
              for (const host of hosts) {
                  if (!ns.hasRootAccess(host)) continue;
                  const hostMax = Math.max(0, ns.getServerMaxRam(host));
                  if (hostMax <= 0) continue;
                  const hostUsed = Math.max(0, ns.getServerUsedRam(host));
                  const reserve = host === "home" ? reserveHome : 0;
                  max += hostMax;
                  used += hostUsed;
                  free += Math.max(0, hostMax - hostUsed - reserve);
              }
              return { max, used, free };
          }
''',
          '''function liveRam(ns, hosts, cfg, boost = null) {
              const reserveHome = homeReserveFor(ns.getServerMaxRam("home"), cfg);
              const shareRam = Math.max(0, ns.getScriptRam(SHARE, "home"));
              let max = 0;
              let used = 0;
              let free = 0;
              let reclaimableShareRam = 0;
              for (const host of hosts) {
                  if (!ns.hasRootAccess(host)) continue;
                  const hostMax = Math.max(0, ns.getServerMaxRam(host));
                  if (hostMax <= 0) continue;
                  const hostUsed = Math.max(0, ns.getServerUsedRam(host));
                  const reserve = host === "home" ? reserveHome : 0;
                  max += hostMax;
                  used += hostUsed;
                  free += Math.max(0, hostMax - hostUsed - reserve);
                  if (boost?.mode === BOOST_MODE_NORMAL && boost?.boostId && shareRam > 0) {
                      const owned = boostProcessesOnHost(ns, host, boost.boostId)
                          .reduce((sum, proc) => sum + Math.max(0, Number(proc.threads) || 0) * shareRam, 0);
                      reclaimableShareRam += owned;
                  }
              }
              return {
                  max,
                  used,
                  free,
                  reclaimableShareRam,
                  schedulableFree: free + reclaimableShareRam,
              };
          }
''')

          replace_once("matrix/services/hacking.js",
          'async function execDistributed(ns, script, threads, args, hosts, cfg) {\n',
          'async function execDistributed(ns, script, threads, args, hosts, cfg, boost = null) {\n')
          replace_once("matrix/services/hacking.js",
          '    for (const item of freePool(ns, hosts, cfg)) {\n        if (remaining <= 0) break;\n',
          '    for (const item of schedulablePool(ns, hosts, cfg, boost)) {\n        if (remaining <= 0) break;\n')
          replace_once("matrix/services/hacking.js",
          '''        const reserve = item.host === "home"
                      ? homeReserveFor(ns.getServerMaxRam("home"), cfg)
                      : 0;
                  const nowFree = Math.max(
''',
          '''        const reserve = item.host === "home"
                      ? homeReserveFor(ns.getServerMaxRam("home"), cfg)
                      : 0;
                  await reclaimBoostShareForRam(ns, item.host, ram, cfg, boost);
                  const nowFree = Math.max(
''')

          replace_once("matrix/services/hacking.js",
          'async function execPlannedComponent(ns, component, args) {\n',
          'async function execPlannedComponent(ns, component, args, cfg, boost) {\n')
          replace_once("matrix/services/hacking.js",
          '''        const pid = ns.exec(
                      component.script,
''',
          '''        await reclaimBoostShareForRam(
                      ns,
                      placement.host,
                      placement.threads * component.ramPerThread,
                      cfg,
                      boost,
                  );
                  const pid = ns.exec(
                      component.script,
''')

          replace_once("matrix/services/hacking.js",
          '''    schedulerReserveRam,
              schedulerUsableIdleRam,
          }) {
''',
          '''    schedulerReserveRam,
              schedulerUsableIdleRam,
              cfg,
              boost,
