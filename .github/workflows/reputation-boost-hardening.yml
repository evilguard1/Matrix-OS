name: reputation-boost-hardening

on:
  push:
    branches:
      - feat/reputation-boost

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reputation-boost
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/harden-reputation-boost.py
      - run: npm ci
      - run: npm test
      - name: Commit hardened feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/reputation-boost-hardening.yml
          rm .github/scripts/harden-reputation-boost.py
          git add -A
          git commit -m "Harden reputation boost lifecycle and stage 1.10.0"
          git push origin HEAD:feat/reputation-boost
