name: test

'on':
  push:
    branches:
      - feat/reputation-boost
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reputation-boost
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply legacy HGW drain fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("matrix/services/hacking.js")
          text = p.read_text()
          old = '''    shareArgs,
    shareCapacityThreads,
    shareProcessMeta,
} from "/matrix/lib/reputation-boost.js";'''
          new = '''    shareArgs,
    shareCapacityThreads,
    shareProcessMeta,
    sameScriptPath,
} from "/matrix/lib/reputation-boost.js";'''
          if text.count(old) != 1:
              raise SystemExit(f"hacking import marker count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        for (const proc of processes) {
            if (![H, G, W].includes(proc.filename)) continue;
            if (trackedPids.has(proc.pid)) continue;'''
          new = '''        for (const proc of processes) {
            // ns.ps() normalizes script filenames (notably dropping the leading
            // slash). After a hacking-service restart, surviving H/G/W children
            // are legacy drain work even though the new service has no in-memory
            // batch/prep tracker for their PIDs.
            if (![H, G, W].some(script => sameScriptPath(proc.filename, script))) continue;
            if (trackedPids.has(proc.pid)) continue;'''
          if text.count(old) != 1:
              raise SystemExit(f"legacy marker count={text.count(old)}")
          p.write_text(text.replace(old, new, 1))

          p = Path("tests/reputation-boost.mjs")
          text = p.read_text()
          old = '''    shareCapacityThreads,
    shareProcessMeta,
} from "../matrix/lib/reputation-boost.js";'''
          new = '''    shareCapacityThreads,
    shareProcessMeta,
    sameScriptPath,
} from "../matrix/lib/reputation-boost.js";'''
          if text.count(old) != 1:
              raise SystemExit(f"test import marker count={text.count(old)}")
          text = text.replace(old, new, 1)

          marker = '''assert.equal(isOwnedShareProcess({ ...owned, filename: "/matrix/workers/other.js" }, "boost-a"), false,
    "ownership matching must remain script-specific");
'''
          addition = '''assert.equal(sameScriptPath("matrix/workers/hack.js", "/matrix/workers/hack.js"), true,
    "legacy H/G/W reconstruction must tolerate ns.ps dropping the leading slash");
assert.equal(sameScriptPath("\\\\matrix\\\\workers\\\\grow.js", "/matrix/workers/grow.js"), true,
    "legacy H/G/W reconstruction must tolerate normalized separators");
assert.equal(sameScriptPath("matrix/workers/share.js", "/matrix/workers/weaken.js"), false,
    "legacy reconstruction must remain worker-script-specific");
'''
          if text.count(marker) != 1:
              raise SystemExit(f"path marker count={text.count(marker)}")
          text = text.replace(marker, marker + addition, 1)

          marker = '''assert.match(hacking, /maxBoostReady/);
assert.match(hacking, /admissionPaused/);'''
          replacement = '''assert.match(hacking, /maxBoostReady/);
assert.match(hacking, /sameScriptPath\\(proc\\.filename, script\\)/,
    "legacy drain reconstruction must normalize ns.ps H/G/W filenames");
assert.doesNotMatch(hacking, /\\[H, G, W\\]\\.includes\\(proc\\.filename\\)/,
    "MAX drain must not use leading-slash-sensitive legacy matching");
assert.match(hacking, /admissionPaused/);'''
          if text.count(marker) != 1:
              raise SystemExit(f"static marker count={text.count(marker)}")
          p.write_text(text.replace(marker, replacement, 1))

          Path(".github/workflows/test.yml").write_text('''name: test\n\non:\n  push:\n    branches:\n      - fix/ram-stage-64\n  pull_request:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci\n      - run: npm test\n''')
          PY
      - run: npm ci
      - run: npm test
      - name: Commit legacy drain reconstruction fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruct legacy HGW workers after hacking restart"
          git push origin HEAD:feat/reputation-boost
