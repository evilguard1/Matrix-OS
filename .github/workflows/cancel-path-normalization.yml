name: reputation-boost-process-path-normalization

'on':
  push:
    branches:
      - feat/reputation-boost

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reputation-boost
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize live process filename handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "matrix/services/hacking.js",
              '''    const args = Array.isArray(proc.args) ? proc.args : [];

    // Prefer the fully-qualified filename/host/args overload. This is
    // both server-scoped and ownership-exact. PID is a fallback only.
    try {
        if (ns.kill(SHARE, host, ...args)) return true;
    } catch {}
    try {
        return Boolean(ns.kill(proc.pid));
    } catch {
        return false;
    }
''',
              '''    const args = Array.isArray(proc.args) ? proc.args : [];
    const processScript = String(proc?.filename ?? SHARE);

    // ns.ps() is authoritative for the filename representation on the host.
    // Use that exact value for filename/host/args termination; ownership was
    // already validated with normalized path matching. PID is a fallback only.
    try {
        if (ns.kill(processScript, host, ...args)) return true;
    } catch {}
    try {
        return Boolean(ns.kill(proc.pid));
    } catch {
        return false;
    }
''',
          )

          p = Path("tests/reputation-boost.mjs")
          text = p.read_text()
          text = text.replace(
              '    isOwnedShareProcess,\n',
              '    isOwnedShareProcess,\n    isShareScriptPath,\n',
              1,
          )
          marker = '''assert.equal(isOwnedShareProcess(owned, "boost-a"), true);
assert.equal(isOwnedShareProcess(owned, "boost-b"), false);
assert.equal(isOwnedShareProcess({ filename: SHARE_SCRIPT, args: [] }, "boost-a"), false);
'''
          replacement = '''assert.equal(isOwnedShareProcess(owned, "boost-a"), true);
assert.equal(isOwnedShareProcess(owned, "boost-b"), false);
assert.equal(isOwnedShareProcess({ filename: SHARE_SCRIPT, args: [] }, "boost-a"), false);
assert.equal(isShareScriptPath(SHARE_SCRIPT), true);
assert.equal(isShareScriptPath("matrix/workers/share.js"), true,
    "ns.ps filename without a leading slash must still be recognized");
assert.equal(isShareScriptPath("\\\\matrix\\\\workers\\\\share.js"), true,
    "path separators must not break ownership recognition");
assert.equal(isOwnedShareProcess({ ...owned, filename: "matrix/workers/share.js" }, "boost-a"), true,
    "ownership matching must tolerate ns.ps path normalization");
'''
          if marker not in text:
              raise SystemExit("tests: ownership marker not found")
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              'assert.match(hacking, /ns\\.kill\\(SHARE,\\s*host,\\s*\\.\\.\\.args\\)/);',
              'assert.match(hacking, /ns\\.kill\\(processScript,\\s*host,\\s*\\.\\.\\.args\\)/);',
              1,
          )
          p.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - name: Commit verified live-path fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/cancel-path-normalization.yml
          git add -A
          git commit -m "Handle normalized share worker paths during cleanup"
          git push origin HEAD:feat/reputation-boost
